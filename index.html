<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宏观交易工作台 | 宏观六变量分析</title>
<meta name="description" content="以增长、通胀、货币政策、财政供给、流动性杠杆和全球美元组织的跨资产宏观交易工作台。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:title" content="宏观交易工作台">
<meta property="og:description" content="从宏观六变量到跨资产结果与下一验证点。">
<meta property="og:image" content="https://evanyfm.github.io/macro-workstation-site/og.png">
<style>
/* ============ 花园 Tokens（明暗两套同步维护） ============ */
:root{
  --paper:#f6f4ee; --paper-soft:#efece4; --ink:#1c1c1a; --charcoal:#2b2b28; --gray:#8a877d;
  --line:rgba(28,28,26,.16); --line-strong:rgba(28,28,26,.4);
  --cinnabar:#b3402a;
  --up:#b3402a;   /* 涨 = 朱砂红（与印章同源） */
  --down:#3f6b4f; /* 跌 = 墨绿 */
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
html[data-theme="dark"]{
  --paper:#141412; --paper-soft:#1b1b18; --ink:#e9e6de; --charcoal:#d6d3ca;
  --gray:#7d7a71; --line:rgba(233,230,222,.16); --line-strong:rgba(233,230,222,.42);
  --cinnabar:#c8503a;
  --up:#c8503a; --down:#6f9a7f;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;
  letter-spacing:.02em;transition:background .9s var(--ease),color .9s var(--ease);
  -webkit-font-smoothing:antialiased}
::selection{background:var(--ink);color:var(--paper)}
a{color:inherit}
.skip{position:absolute;left:-999px;top:0;background:var(--paper);padding:10px 16px;z-index:99}
.skip:focus{left:12px;top:12px}

/* ============ 顶栏 ============ */
header{position:fixed;top:0;left:0;right:0;z-index:50;
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.head-in{max-width:1120px;margin:0 auto;padding:16px 48px 0}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--ink)}
.seal{width:24px;height:24px;background:var(--cinnabar);display:flex;align-items:center;justify-content:center;
  color:#f6f4ee;font-family:var(--serif);font-size:14.5px;font-weight:600;flex:none}
.brand-name{font-family:var(--serif);font-size:17.5px;font-weight:600;letter-spacing:.12em;line-height:1.35}
.brand-en{display:block;font-family:var(--sans);font-size:10.0px;letter-spacing:.32em;color:var(--gray);
  text-transform:uppercase;font-weight:400}
.head-meta{display:flex;align-items:center;gap:18px;font-size:13.0px;color:var(--gray);flex-wrap:wrap;justify-content:flex-end}
.head-meta b{color:var(--charcoal);font-weight:400}
.head-meta .warn{color:var(--up)}
.taiji{width:24px;height:24px;border:none;background:transparent;cursor:pointer;padding:0;flex:none;color:var(--ink)}
.taiji:focus-visible{outline:1px solid var(--cinnabar);outline-offset:3px}
.taiji svg{display:block;width:100%;height:100%;overflow:visible}
.taiji .ring{fill:none;stroke:currentColor;stroke-width:1;opacity:.55;transition:opacity .5s}
.taiji:hover .ring{opacity:1}
.taiji .disc{transform-origin:12px 12px;transition:transform 1.1s var(--ease)}
html[data-theme="dark"] .taiji .disc{transform:rotate(180deg)}
.taiji .half{fill:currentColor;opacity:0;transform-origin:12px 12px;transform:rotate(-100deg);
  transition:opacity .7s var(--ease),transform .9s var(--ease)}
.taiji:hover .half{opacity:1;transform:rotate(0deg)}
.taiji .d1,.taiji .d2{opacity:0;transition:opacity .7s var(--ease) .1s}
.taiji:hover .d1,.taiji:hover .d2{opacity:1}
.taiji .d1{fill:var(--paper)}
.taiji .d2{fill:currentColor}
.taiji .still{fill:currentColor;transition:opacity .5s}
.taiji:hover .still{opacity:0}

/* ============ 标签导航 ============ */
.tab-row{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tab-row::-webkit-scrollbar{display:none}
.tab{border:none;background:transparent;cursor:pointer;color:var(--gray);
  font-family:var(--sans);font-size:14.5px;letter-spacing:.1em;font-weight:300;
  padding:11px 0 13px;position:relative;white-space:nowrap;transition:color .4s}
.tab:focus-visible{outline:1px solid var(--cinnabar);outline-offset:2px}
.tab::after{content:"";position:absolute;left:0;bottom:7px;width:100%;height:1px;background:var(--ink);
  transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.tab:hover{color:var(--ink)}
.tab:hover::after{transform:scaleX(.4)}
.tab.on{color:var(--ink)}
.tab.on::after{transform:scaleX(1)}

/* ============ 主体 ============ */
main{max-width:1120px;margin:0 auto;padding:138px 48px 0}
.view{display:none}
.view.on{display:block}
.blk{margin-top:56px}
.line-head{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;
  border-bottom:1px solid var(--line-strong);padding-bottom:11px}
.line-head h2{font-family:var(--serif);font-size:17.0px;font-weight:600;letter-spacing:.06em}
.line-head .en{font-family:var(--sans);font-size:11.0px;letter-spacing:.3em;color:var(--gray);
  text-transform:uppercase;font-weight:400}
.line-head .note{margin-left:auto;font-size:13.0px;color:var(--gray)}
.blk > .lead-note{font-size:14.0px;color:var(--gray);margin-top:12px;line-height:1.8}

/* ============ 主论断 ============ */
.thesis{margin-top:44px}
.thesis .eyebrow{display:flex;align-items:baseline;gap:12px}
.thesis .eyebrow .no{font-family:var(--serif);font-size:15.0px;font-weight:600;color:var(--cinnabar)}
.thesis .eyebrow .en{font-family:var(--sans);font-size:11.0px;letter-spacing:.3em;color:var(--gray);text-transform:uppercase}
.thesis h1{font-family:var(--serif);font-size:clamp(21px,3.4vw,30px);font-weight:600;
  letter-spacing:.03em;line-height:1.5;margin-top:16px;max-width:34ch}
.thesis .sum{font-size:15.0px;line-height:1.95;color:var(--charcoal);margin-top:16px;max-width:72ch}
.thesis .regime{display:flex;align-items:center;flex-wrap:wrap;margin-top:22px;font-size:14.0px;color:var(--charcoal)}
.thesis .regime .tag{padding:0 14px;border-left:1px solid var(--line-strong);letter-spacing:.06em}
.thesis .regime .tag:first-child{padding-left:0;border-left:none}
.thesis .meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:24px;font-size:13.0px;color:var(--gray)}
.thesis .meta b{color:var(--charcoal);font-weight:400}
.thesis .meta .warn{color:var(--up)}

/* ============ 六变量矩阵 ============ */
.matrix-cols{display:grid;grid-template-columns:170px 1.7fr 1.1fr auto;gap:16px;
  padding:14px 0 6px;font-size:12.5px;color:var(--gray);letter-spacing:.1em}
.vrow{display:grid;grid-template-columns:170px 1.7fr 1.1fr auto;gap:16px;align-items:start;
  padding:22px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;
  background:transparent;border-left:none;border-right:none;border-top:none;
  font-family:var(--sans);color:var(--ink);transition:background .4s}
.vrow:focus-visible{outline:1px solid var(--cinnabar);outline-offset:-1px}
.vrow .vn{display:flex;gap:10px;align-items:baseline}
.vrow .vn .no{font-family:var(--serif);font-size:17.0px;font-weight:600;color:var(--cinnabar)}
.vrow .vn .nm{font-family:var(--serif);font-size:17.0px;font-weight:600;letter-spacing:.05em;
  transition:transform .45s var(--ease)}
.vrow .vn .en{display:block;font-size:10.5px;letter-spacing:.26em;color:var(--gray);
  text-transform:uppercase;margin-top:5px}
.vrow .vst{font-size:15.0px;line-height:1.8;color:var(--ink)}
.vrow .vst small{display:block;font-size:13.0px;color:var(--gray);margin-top:5px;letter-spacing:.02em}
.vrow .vas{font-size:14.0px;color:var(--charcoal);letter-spacing:.04em;padding-top:2px}
.vrow:hover .vn .nm{transform:translateX(6px)}
@media(hover:hover){
  .vrow::before{content:"";position:absolute}
}

/* ============ 跨变量冲突 / 市场结果 / 边际变化 ============ */
.rel-grid{display:grid;grid-template-columns:repeat(3,1fr)}
.rel-grid article{padding:24px 26px 28px;border-right:1px solid var(--line)}
.rel-grid article:last-child{border-right:none}
.rel-grid h3{font-family:var(--serif);font-size:16.0px;font-weight:600;letter-spacing:.04em}
.rel-grid .ev{font-size:14.5px;color:var(--charcoal);line-height:1.85;margin-top:13px}
.rel-grid .imp{font-size:13.5px;color:var(--gray);line-height:1.8;margin-top:11px}

.mgroup{margin-top:42px}
.mgroup .gh{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.mgroup .gh h3{font-family:var(--serif);font-size:16.0px;font-weight:600;letter-spacing:.06em}
.mgroup .gh .en{font-size:10.5px;letter-spacing:.28em;color:var(--gray);text-transform:uppercase}
.mrow{display:grid;grid-template-columns:1.35fr 108px 78px 78px 78px 1.5fr;gap:14px;align-items:baseline;
  padding:17px 0;border-bottom:1px solid var(--line)}
.mrow .mn{font-size:15.0px;font-weight:400}
.mrow .mn .sym{display:block;font-size:12.0px;color:var(--gray);letter-spacing:.06em;margin-top:4px}
.mrow .mv{font-variant-numeric:tabular-nums;font-size:16.0px;font-weight:400}
.mrow .mc{font-variant-numeric:tabular-nums;font-size:14.0px}
.mrow .mc .lb{display:block;font-size:11.0px;color:var(--gray);letter-spacing:.18em;margin-bottom:3px}
.mrow .mi{font-size:13.5px;color:var(--gray);line-height:1.75}
.up{color:var(--up)} .down{color:var(--down)}
.opp{padding:2px 0 18px;border-bottom:1px solid var(--line)}
.opp .lb{font-family:var(--serif);font-size:13.0px;font-weight:600;color:var(--ink);letter-spacing:.14em}
.opp p{font-size:13.5px;color:var(--gray);line-height:1.8;margin-top:7px;padding-left:13px;
  border-left:1px solid var(--line-strong);max-width:82ch}

.krow{display:grid;grid-template-columns:46px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.krow .kno{font-family:var(--serif);font-size:17.0px;font-weight:600;color:var(--cinnabar)}
.krow h3{font-family:var(--serif);font-size:16.0px;font-weight:600;letter-spacing:.04em}
.krow p{font-size:14.5px;color:var(--charcoal);line-height:1.9;margin-top:9px;max-width:76ch}

/* ============ 变量页 ============ */
.plead{margin-top:48px}
.plead .eyebrow{display:flex;align-items:baseline;gap:12px}
.plead .eyebrow .no{font-family:var(--serif);font-size:16.0px;font-weight:600;color:var(--cinnabar)}
.plead .eyebrow .nm{font-family:var(--serif);font-size:16.0px;font-weight:600;letter-spacing:.1em}
.plead .eyebrow .en{font-size:11.0px;letter-spacing:.3em;color:var(--gray);text-transform:uppercase}
.plead h1{font-family:var(--serif);font-size:clamp(20px,3vw,26px);font-weight:600;
  letter-spacing:.04em;margin-top:16px}
.plead .q{font-family:var(--serif);font-size:18.0px;font-weight:400;color:var(--charcoal);
  letter-spacing:.02em;margin-top:14px;padding-bottom:20px;border-bottom:1px solid var(--line-strong)}
.plead .pm{display:flex;gap:34px;flex-wrap:wrap;margin-top:16px;font-size:13.0px;color:var(--gray)}
.plead .pm b{font-size:14.5px;color:var(--ink);font-weight:400;display:block;margin-top:4px}
.vlogic{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr;gap:14px;margin-top:34px;align-items:start}
.vlogic .arr{font-style:normal;color:var(--gray);text-align:center;padding-top:26px;font-size:15.0px}
.vlogic article{padding-top:18px}
.vlogic article .no{font-family:var(--serif);font-size:14.0px;font-weight:600;color:var(--cinnabar)}
.vlogic article .tt{font-family:var(--serif);font-size:15.0px;font-weight:600;letter-spacing:.14em;margin-left:8px}
.vlogic article p{font-size:14.5px;color:var(--charcoal);line-height:1.9;margin-top:12px;
  border-top:1px solid var(--line);padding-top:12px}

/* ============ 唯一证据表 ============ */
.evrow{display:grid;grid-template-columns:1.25fr 128px 158px 1.55fr;gap:14px;align-items:baseline;
  padding:16px 0;border-bottom:1px solid var(--line)}
.evrow.has-insight{cursor:pointer;transition:background .4s}
.evrow.has-insight:hover{background:var(--paper-soft)}
.evrow .enm{font-size:15.0px}
.evrow .enm .st{display:inline-block;font-size:12.0px;color:var(--gray);margin-left:8px;letter-spacing:.1em}
.evrow .st.stale{color:var(--up)}
.evrow .st.missing{color:var(--gray)}
.evrow .evv{font-variant-numeric:tabular-nums;font-size:15.5px}
.evrow .evv .chg{display:block;font-size:13.5px;margin-top:3px}
.evrow .esrc{font-size:12.5px;color:var(--gray);line-height:1.7}
.evrow .esrc a{color:var(--gray);text-decoration:none;border-bottom:1px dotted var(--gray)}
.evrow .esrc a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.evrow .ein{font-size:13.5px;color:var(--gray);line-height:1.75}
.evrow .ein .ihint{display:inline-block;width:5px;height:5px;border:1px solid var(--cinnabar);
  border-radius:50%;margin-left:6px;vertical-align:2px}

/* ============ 图表 ============ */
.chart{margin-top:22px}
.chart .cl{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px;color:var(--gray)}
.chart .cl i{display:inline-block;width:16px;height:0;border-top:1.5px solid var(--ink);vertical-align:middle;margin-right:7px}
.chart .cl i.c-gray{border-top-color:var(--gray)}
.chart .cl i.c-up{border-top-color:var(--up)}
.chart .cl i.c-down{border-top-color:var(--down)}
.chart .cl i.dash{border-top-style:dashed}
.chart svg{display:block;width:100%;height:auto}
.cl-ink{stroke:var(--ink);fill:none;stroke-width:1.4}
.cl-gray{stroke:var(--gray);fill:none;stroke-width:1.4}
.cl-up{stroke:var(--up);fill:none;stroke-width:1.4}
.cl-down{stroke:var(--down);fill:none;stroke-width:1.4}
.dash{stroke-dasharray:5 4}
.dt-ink{fill:var(--ink)} .dt-gray{fill:var(--gray)} .dt-up{fill:var(--up)} .dt-down{fill:var(--down)}
.ax{stroke:var(--line);stroke-width:1}
.axt{fill:var(--gray);font-size:12.0px;font-family:var(--sans)}
.chart-note{font-size:13.0px;color:var(--gray);margin-top:10px;line-height:1.7}

/* ============ FOMC / 流动性 ============ */
.fedrow{padding:20px 0;border-bottom:1px solid var(--line)}
.fedrow .fh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.fedrow .fm{font-family:var(--serif);font-size:16.0px;font-weight:600;letter-spacing:.05em}
.fedrow .fd{font-size:12.5px;color:var(--gray)}
.pbar{display:flex;align-items:center;gap:12px;margin-top:11px}
.pbar .pl{font-size:13.0px;color:var(--gray);width:36px;letter-spacing:.06em}
.pbar .track{flex:1;height:2px;background:var(--line);position:relative}
.pbar .fill{position:absolute;left:0;top:0;height:2px}
.pbar .fill.f-up{background:var(--up)}
.pbar .fill.f-ink{background:var(--ink)}
.pbar .fill.f-down{background:var(--down)}
.pbar .pv{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--charcoal);width:46px;text-align:right}
.fedrow .fi{font-size:14.0px;color:var(--charcoal);line-height:1.85;margin-top:12px;max-width:80ch}
.fedrow .fsrc{font-size:12.5px;color:var(--gray);margin-top:8px}
.fedrow .fsrc a{color:var(--gray);text-decoration:none;border-bottom:1px dotted var(--gray)}

.lqrow{display:grid;grid-template-columns:1.15fr 96px 1.75fr;gap:16px;align-items:baseline;
  padding:15px 0;border-bottom:1px solid var(--line)}
.lqrow .ld{font-size:15.0px}
.lqrow .ld .dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:10px;vertical-align:2px}
.lqrow .ld .dot.s1{background:var(--ink)}
.lqrow .ld .dot.s0{border:1px solid var(--gray)}
.lqrow .lstat{font-size:14.0px;color:var(--charcoal)}
.lqrow .lev{font-size:13.5px;color:var(--gray);line-height:1.75}

/* ============ 历史复盘 ============ */
.tl{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line-strong)}
.tl button{border:none;background:transparent;cursor:pointer;color:var(--gray);
  font-family:var(--sans);font-size:14.0px;letter-spacing:.08em;padding:11px 18px 13px;
  position:relative;transition:color .4s}
.tl button::after{content:"";position:absolute;left:0;bottom:7px;width:100%;height:1px;background:var(--ink);
  transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.tl button:hover{color:var(--ink)}
.tl button.on{color:var(--ink)}
.tl button.on::after{transform:scaleX(1)}
.rpt{margin-top:36px}
.rpt h2{font-family:var(--serif);font-size:21.0px;font-weight:600;letter-spacing:.03em;line-height:1.55;max-width:44ch}
.rpt .rc{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;
  border-top:1px solid var(--line);padding-top:20px}
.rpt .rc small{display:block;font-size:12.5px;color:var(--gray);letter-spacing:.12em}
.rpt .rc p{font-size:15.0px;color:var(--charcoal);line-height:1.85;margin-top:8px}
.rpt .rlink{display:inline-flex;align-items:center;gap:8px;margin-top:24px;font-size:14.0px;color:var(--charcoal);
  text-decoration:none;border-bottom:1px solid var(--line-strong);padding-bottom:3px;transition:color .4s,border-color .4s}
.rpt .rlink:hover{color:var(--ink);border-bottom-color:var(--ink)}
.rpt .conf{margin-top:14px;font-size:13.0px;color:var(--gray)}
.thr li{list-style:none;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--line);font-size:14.5px;color:var(--charcoal);line-height:1.7}
.thr li .tno{font-family:var(--serif);font-size:14.5px;font-weight:600;color:var(--cinnabar)}

/* ============ 抽屉（指标解释卡） ============ */
#scrim{position:fixed;inset:0;background:rgba(28,28,26,.28);opacity:0;pointer-events:none;
  transition:opacity .5s var(--ease);z-index:70}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);z-index:80;
  background:var(--paper);border-left:1px solid var(--line-strong);
  transform:translateX(102%);transition:transform .5s var(--ease);overflow-y:auto;padding:30px 32px 40px}
#drawer.on{transform:none}
#drawer .dhead{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line-strong);padding-bottom:14px}
#drawer .dhead .tt{font-family:var(--serif);font-size:16.0px;font-weight:600;letter-spacing:.08em}
#drawer .dhead .en{display:block;font-size:10.5px;letter-spacing:.3em;color:var(--gray);
  text-transform:uppercase;margin-top:5px}
#drawer .dclose{border:none;background:transparent;color:var(--gray);cursor:pointer;
  font-size:14.0px;letter-spacing:.1em;padding:4px 0 4px 12px;transition:color .4s}
#drawer .dclose:hover{color:var(--ink)}
#drawer .dname{font-family:var(--serif);font-size:19.0px;font-weight:600;margin-top:22px;letter-spacing:.04em}
#drawer .dval{font-size:14.0px;color:var(--gray);margin-top:7px}
#drawer dl{margin-top:10px}
#drawer dt{font-size:12.5px;color:var(--gray);letter-spacing:.16em;margin-top:19px}
#drawer dd{font-size:14.5px;color:var(--charcoal);line-height:1.85;margin-top:7px}

/* ============ 页脚 ============ */
footer{max-width:1120px;margin:88px auto 0;padding:26px 48px 46px;border-top:1px solid var(--line);
  font-size:13.0px;color:var(--gray);line-height:2.1;letter-spacing:.04em}
footer .fb{color:var(--charcoal)}

/* ============ 入场动效 ============ */
.rv{opacity:0;transform:translateY(26px);
  transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.rv.in{opacity:1;transform:none}

var TABS = [{id:'overview', label:'\u516d\u53d8\u91cf\u603b\u89c8'}]
  .concat(VAR_DEFS.map(function(v){ return {id:v.id, label:v.name.replace(' / ','/').replace(' /','/')}; }))
  .concat([{id:'review', label:'\u5386\u53f2\u590d\u76d8'}]);
var tabRow = $('#tabRow');
TABS.forEach(function(t){
  var b = document.createElement('button');
  b.className = 'tab'; b.textContent = t.label; b.dataset.view = t.id;
  b.setAttribute('role','tab');
  b.addEventListener('click', function(){ go(t.id); });
  tabRow.appendChild(b);
});

function go(id){
  document.querySelectorAll('.tab').forEach(function(b){
    var on = b.dataset.view === id;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('.view').forEach(function(v){
    v.classList.toggle('on', v.id === 'view-' + id);
  });
  document.querySelectorAll('.view .rv').forEach(function(el){ el.classList.remove('in'); });
  observeAll();
  if (history.replaceState) history.replaceState(null, '', '#' + id);
  window.scrollTo({top:0, behavior:'auto'});
}

function evRow(e, ins){

    '<span class="enm">' + esc(e.name) + '<span class="st ' + stCls + '">' + stTxt + '</span></span>' +
    '<span class="evv">' + esc(e.value) + (e.change && e.change !== '--' ? '<span class="chg ' + cls + '">' + esc(e.change) + '</span>' : '') + '</span>' +
    '<span class="esrc">' + esc(e.date || '\u2014') +
    (e.source ? '<br><a href="' + esc(e.source.url) + '" target="_blank" rel="noreferrer">' + esc(e.source.label) + '</a>' : '') + '</span>' +
    '<span class="ein">' + esc(e.interpretation) + (ins ? '<i class="ihint" title="\u6307\u6807\u89e3\u91ca\u5361"></i>' : '') + '</span></div>';
  return h;
}
function bar(label, val, cls){
  return '<div class="pbar"><span class="pl">' + label + '</span>' +

    '<span class="pv">' + (val != null ? val.toFixed(1) + '%' : '\u2014') + '</span></div>';
}

function rptHtml(date){

/* ============ 细线图表 ============ */
function chartBlock(inner){
  return '<div class="chart">' + inner + '</div>';
}
function mkChart(cats, series, domL, domR, fmtL, fmtR){
  var W = 720, H = 230, pl = 44, pr = domR ? 52 : 16, pt = 18, pb = 30;
  var iw = W - pl - pr, ih = H - pt - pb;
  var n = cats.length;
  function X(i){ return pl + (n <= 1 ? 0 : iw * i / (n - 1)); }
  function Y(val, dom){ return pt + ih * (1 - (val - dom[0]) / (dom[1] - dom[0])); }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="\u8d8b\u52bf\u56fe">';
  s += '<line class="ax" x1="' + pl + '" y1="' + (pt + ih) + '" x2="' + (W - pr) + '" y2="' + (pt + ih) + '"/>';
  [0, .5, 1].forEach(function(t){
    var val = domL[0] + (domL[1] - domL[0]) * t, y = Y(val, domL);
    s += '<text class="axt" x="' + (pl - 7) + '" y="' + (y + 3.5) + '" text-anchor="end">' + (fmtL ? fmtL(val) : val.toFixed(2)) + '</text>';
    if (t > 0) s += '<line class="ax" x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '" opacity=".45"/>';
  });
  if (domR){
    [0, .5, 1].forEach(function(t){
      var val = domR[0] + (domR[1] - domR[0]) * t, y = Y(val, domR);
      s += '<text class="axt" x="' + (W - pr + 7) + '" y="' + (y + 3.5) + '">' + (fmtR ? fmtR(val) : val.toFixed(2)) + '</text>';
    });
  }
  s += '<text class="axt" x="' + pl + '" y="' + (H - 8) + '">' + esc(cats[0]) + '</text>';
  s += '<text class="axt" x="' + (W - pr) + '" y="' + (H - 8) + '" text-anchor="end">' + esc(cats[cats.length-1]) + '</text>';
  series.forEach(function(sr){
    var pts = [], dots = '';
    sr.data.forEach(function(v){
      if (v == null) return;
      var i = cats.indexOf(sr.catOf ? sr.catOf(v) : v[0]);
      if (i < 0) return;
      var x = X(i), y = Y(sr.axis === 'R' ? v[2] : v[1], sr.axis === 'R' ? domR : domL);
      pts.push(x.toFixed(1) + ',' + y.toFixed(1));
      dots += '<circle class="dt-' + sr.cls + '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.4"/>';
    });
    if (sr.line !== false && pts.length > 1){
      s += '<polyline class="cl-' + sr.cls + (sr.dash ? ' dash' : '') + '" points="' + pts.join(' ') + '"/>';
    }
    if (!sr.noDots) s += dots;
  });
  s += '</svg>';
  return s;
}
function rateChart(){
  var rows = S.rateTrend;
  var cats = [];
  rows.forEach(function(r){ if (cats.indexOf(r.date) < 0) cats.push(r.date); });
  function pair(rows, key){
    var out = [];
    rows.forEach(function(r){ if (r[key] != null) out.push([r.date, r[key], r[key]]); });
    return out;
  }
  var legend = '<div class="cl"><span><i></i>2Y</span><span><i class="c-gray"></i>10Y</span><span><i class="c-up"></i>3M SOFR\uff08\u53f3\u8f74\uff09</span></div>';
  return legend + mkChart(cats, [
    { data: pair(rows, 'ust2'), cls: 'ink', axis: 'L', catOf: function(v){ return v[0]; } },
    { data: pair(rows, 'ust10'), cls: 'gray', axis: 'L', catOf: function(v){ return v[0]; } },
    { data: pair(rows, 'sofr3m'), cls: 'up', axis: 'R', catOf: function(v){ return v[0]; } }
  ], [4.2, 5.0], [3.84, 3.9], function(v){ return v.toFixed(2); }, function(v){ return v.toFixed(2); });
}
function liquidityChart(){
  var rows = S.liquidityTrend, cats = rows.map(function(r){ return r.date; });
  function pair(key){
    return rows.map(function(r){ return [r.date, r[key], r[key]]; }).filter(function(v){ return v[1] != null; });
  }
  var legend = '<div class="cl"><span><i></i>\u94f6\u884c\u51c6\u5907\u91d1\uff08$tn\uff0c\u5de6\u8f74\uff09</span><span><i class="c-gray dash"></i>TGA\uff08$tn\uff0c\u53f3\u8f74\uff09</span></div>';
  return legend + mkChart(cats, [
    { data: pair('reserves'), cls: 'ink', axis: 'L', catOf: function(v){ return v[0]; } },
    { data: pair('tga'), cls: 'gray', axis: 'R', dash: true, catOf: function(v){ return v[0]; } }
  ], [2.85, 3.0], [0.9, 0.98], function(v){ return v.toFixed(2); }, function(v){ return v.toFixed(2); });
}
function creditChart(){
  var rows = S.creditSpreadTrend, cats = rows.map(function(r){ return r.date; });
  function pair(key){
    return rows.map(function(r){ return [r.date, r[key], r[key]]; }).filter(function(v){ return v[1] != null; });
  }
  var legend = '<div class="cl"><span><i class="c-up"></i>CCC\u53ca\u4ee5\u4e0b OAS\uff08%\uff0c\u5de6\u8f74\uff09</span><span><i class="c-gray dash"></i>CCC-BBB\uff08%\uff0c\u5de6\u8f74\uff09</span><span><i class="c-down"></i>BBB OAS\uff08%\uff0c\u53f3\u8f74\uff09</span></div>';
  return legend + mkChart(cats, [
    { data: pair('cccOas'), cls: 'up', axis: 'L', catOf: function(v){ return v[0]; } },
    { data: pair('cccBbbOas'), cls: 'gray', axis: 'L', dash: true, catOf: function(v){ return v[0]; } },
    { data: pair('bbbOas'), cls: 'down', axis: 'R', catOf: function(v){ return v[0]; } }
  ], [9.2, 10.7], [0.96, 1.02], function(v){ return v.toFixed(1); }, function(v){ return v.toFixed(2); });
}

/* ============ 入场动效 ============ */
var io = null;
function observeAll(){
  if (!('IntersectionObserver' in window)){
    document.querySelectorAll('.rv').forEach(function(el){ el.classList.add('in'); });
    return;
  }
  if (!io){
    io = new IntersectionObserver(function(es){
      es.forEach(function(en){ if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: .06 });
  }
  document.querySelectorAll('.rv:not(.in)').forEach(function(el){ io.observe(el); });
}
function bindRv(root){
  var els = (root || document).querySelectorAll('.rv:not(.in)');
  if (!('IntersectionObserver' in window)){ els.forEach(function(el){ el.classList.add('in'); }); return; }
  observeAll();
}
observeAll();
